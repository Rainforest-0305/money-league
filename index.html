<!DOCTYPE html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
    <meta name="theme-color" content="#6B4EFF" />
    <meta name="description" content="머니리그 — 가상의 1만 달러로 210명의 트레이더와 겨루는 모의투자 게임" />
    <title>머니리그</title>
    <!--
      [P1 2026-08-05] Pretendard self-host.
      기존: cdn.jsdelivr.net preconnect + dynamic-subset CSS (외부 요청 2건 이상).
      정적 단독 빌드는 **외부 네트워크 요청 0건**이 요건이라 폰트를 동봉한다.
      public/fonts/ 는 가공 없이 복사되며, 경로는 base(./) 를 따라 상대경로로 출력된다.
    -->
    <link rel="preload" href="./fonts/pretendard-0.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./fonts/pretendard.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect width='26' height='26' rx='8' fill='%236B4EFF'/%3E%3Cpath d='M6 17.5 10.5 12l3.5 3.4L20 8' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <!--
      [MS Store 2026-08-18] 웹앱 매니페스트 배선.
      PWABuilder 의 Windows 패키징은 «라이브 HTML 을 읽어» manifest 를 찾는다.
      manifest.json 파일만 올려두고 이 <link> 가 없으면 PWABuilder 는 그것을
      **발견하지 못한다** — 라이브 5종(sumo-bounce 등)이 전부 이 링크를 갖고 있다.
      public/ 안의 파일은 base('./') 를 따라 상대경로로 출력된다.
    -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <script type="module" crossorigin src="./assets/index-BXhvIew_.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D_wmbLN2.css">
  </head>
  <body>
    <div id="root"></div>
    <!--
      오프라인 서비스워커. 라이브 5종과 «같은 형태»로 맞춘다(검증된 패턴 재사용).
      - 토스 미니앱 WebView 안에서는 등록하지 않는다: .ait 번들은 자체 로딩
        경로를 쓰므로 SW 가 끼어들 이유가 없고, 캐시가 번들 갱신을 가릴 수 있다.
      - 실패는 전부 삼킨다. SW 는 부가기능이라 앱 부팅을 막으면 안 된다.
    -->
    <script>
      (function () {
        var inToss = typeof window.ReactNativeWebView !== 'undefined';
        if (inToss) return;
        if (!('serviceWorker' in navigator)) return;
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {});
        });
      })();
    </script>
  </body>
</html>
